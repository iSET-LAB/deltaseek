schema_version: 1
scenario:
  id: hall_b_task
  seed: 0
  description: >
    One displaced window and five objects that are not in the BIM at all.
    The clutter is arranged so no single viewpoint resolves the room: the tall
    stack blocks the sightline from the room centre to the window it stands in
    front of, and hides a low crate behind itself against the south wall.
deviations:
  # --- the modelled element that moved -------------------------------------
  - id: window-displaced
    type: displaced
    severity: 0.7
    target: 1s7WttW8LF3wo3GFHzG4IH
    translation: [0.35, 0.0, -0.18]

  # --- objects present on site but absent from the model -------------------
  - id: unexpected-stack
    type: unexpected
    severity: 0.8
    element:
      id: unexpected-stack
      ifc_class: IfcBuildingElementProxy
      name: Pallet stack (unmodelled)
      pose: {xyz: [6.90, -4.60, 0.80], rpy: [0.0, 0.0, -0.0157]}
      geometry: {type: box, size: [1.20, 0.90, 1.60]}
      material: {rgba: [0.62, 0.36, 0.14, 1.0]}
      static: true
      collision: true
  - id: unexpected-carton
    type: unexpected
    severity: 0.5
