# DeltaSeek public-spec baseline.
#
# This file uses only Clearpath-supported robot.yaml fields and released
# description assets.  It is NOT the as-built configuration for the custom
# showcase robot.  Before deploying to hardware, replace it with the physical
# robot's /etc/clearpath/robot.yaml and retain project-specific overrides in a
# separate overlay.

serial_number: a300-00000
version: 0

system:
  hosts:
    - hostname: cpr-a300-00000
      ip: 192.168.131.1
  ros2:
    namespace: a300_00000

platform:
  battery:
    model: S_24V20_U1
    configuration: S1P2
  attachments:
    - name: front_bumper
      type: a300.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a300.bumper
      parent: rear_bumper_mount
    - name: enclosure
      type: a300.amp_enclosure
      parent: base_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
  mcu:
    protocol: proton

sensors:
  imu:
    - model: phidgets_spatial
      urdf_enabled: true
      launch_enabled: true
      parent: base_link
      xyz: [0.059, 0.0, 0.161275]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        phidgets_spatial:
          data_interval_ms: 20

  # Eye-in-hand inspection sensor.  Mounting the camera on the tool flange is
  # what lets viewpoint selection reach vantage points a base-mounted sensor
  # cannot: behind and beneath assemblies, and into enclosures.
  #
  # rpy aims the camera's +x view axis along the tool's +z approach axis; the
  # Clearpath realsense macro derives the optical frame from <name>_link.
  # The transform is a placeholder until the as-built mount is measured.
  lidar3d:
    # 360 deg geometry at chassis height.  It sees bulk presence and absence
    # cheaply from anywhere in the room, which is exactly why it belongs in
    # the baseline: it removes the easy detections from the comparison and
    # leaves the ones that actually need a placed viewpoint.
    #
    # On the enclosure deck, forward of the arm.  The deck is the top face of
    # the AMP enclosure at z = 0.407, spanning x = +/-0.486 and y = +/-0.226,
    # so anything mounted inside that rectangle at that height is standing on
    # the robot.  An earlier revision put this on a side bracket at y = 0.30,
    # which is 0.074 m beyond the side face: it hung in the air next to the
    # body.
    #
    # Forward of the arm rather than behind it, so the mast has a clear view
    # along the direction of travel; the arm and its own body still occupy a
    # rearward sector, so this is not the unobstructed 360 deg sweep a tall
    # mast would give.
    - model: ouster_os1
      urdf_enabled: true
      launch_enabled: true
      parent: base_link
      xyz: [0.26, 0.0, 0.407]
      rpy: [0.0, 0.0, 0.0]

  camera:
    # Order is load-bearing: Clearpath indexes cameras positionally, so the
    # eye-in-hand sensor must stay first to remain camera_0.  Reordering this
    # list silently repoints every camera_0 reference in launch files, RViz
    # configs, and the forward-kinematics chain.
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      parent: arm_0_tool0
      xyz: [0.0, 0.0, 0.035]
      rpy: [0.0, -1.5707963, 0.0]
      ros_parameters:
        intel_realsense:
          camera_name: inspection_camera
          device_type: d435
          enable_color: true
          enable_depth: true
          pointcloud.enable: true

    # Chassis camera.  Deliberately the same D435 as the eye-in-hand sensor,
    # so the ablation isolates where a camera is mounted rather than how good
    # it is.
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: true
      # Also on the deck, at its front edge and offset off the lidar's
      # forward axis so the two do not stare through each other.  Angled
      # 0.17 rad down for near-field inspection.
      parent: base_link
      xyz: [0.44, -0.10, 0.407]
      rpy: [0.0, 0.17, 0.0]
      ros_parameters:
        intel_realsense:
          camera_name: chassis_camera
          device_type: d435
          enable_color: true
          enable_depth: true
          pointcloud.enable: true

manipulators:
  moveit:
    enable: true
  arms:
    - model: universal_robots
      parent: enclosure_center_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ur_type: ur5e
      robot_ip: 192.168.131.40
      headless_mode: false
      kinematics_parameters_file: "$(find ur_description)/config/ur5e/default_kinematics.yaml"
